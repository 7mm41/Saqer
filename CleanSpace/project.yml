# XcodeGen project spec for CleanSpace.
#
#   brew install xcodegen        # once
#   cd CleanSpace && xcodegen generate
#   open CleanSpace.xcodeproj
#
# Then set your Signing Team on the CleanSpace target and run on a real device.
# (See README for a no-XcodeGen path too.)

name: CleanSpace
options:
  bundleIdPrefix: com.cleanspace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <- set your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CleanSpace:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CleanSpace
    settings:
      base:
        PRODUCT_NAME: CleanSpace
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanspace.app
        INFOPLIST_FILE: CleanSpace/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
