name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

# bash with pipefail, so a failing command piped into tail still fails the step
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, RTL logical properties, integer money)
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit and integration tests (money, state machine, API flows, security)
        run: pnpm --filter @katf/shared --filter @katf/demo --filter @katf/api test
      - name: Build everything
        run: pnpm build
      - name: OpenAPI and state machine docs are current
        run: |
          pnpm --filter @katf/api exec tsx src/cli.ts state-machine > /tmp/state.mmd
          diff -u docs/state-machine.mmd /tmp/state.mmd

  e2e:
    name: End-to-end (Playwright + axe)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @katf/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @katf/e2e test
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: Secrets in the repository or its history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          # this project's history only; other branches in the repository are separate projects
          ./gitleaks git --no-banner --redact -v --log-opts="HEAD" .
      - name: Shell scripts
        run: shellcheck -x -S warning deploy/*.sh

  docker:
    name: Production images build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api, web and caddy images
        run: |
          for t in api web caddy; do
            docker buildx build -f deploy/Dockerfile --target "$t" -t "katf-$t:ci" --load .
          done
      - name: Caddyfile is valid
        run: docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=ops@example.com -e ADMIN_PATH=ciadminpath0123456789abcdef -e MAP_TILE_HOSTS= -e PAYMENT_HOSTS= katf-caddy:ci caddy validate --config /etc/caddy/Caddyfile
