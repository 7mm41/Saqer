# Production stack: Sarena + PostgreSQL + Caddy (automatic HTTPS).
# On a new Ubuntu server, `sudo bash deploy/install.sh` does all of this for you. By hand:
#   cp backend/.env.example backend/.env   # set JWT_SECRET, ADMIN_EMAIL/PASSWORD, PUBLIC_URL, APNS_*, SMS...
#   echo "SARENA_DOMAIN=sarena.fun" > .env # the domain whose DNS points at this server
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sarena
      POSTGRES_USER: sarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sarena:${POSTGRES_PASSWORD:-change-me}@db:5432/sarena
    ports:
      # Reachable from the server itself only; the public goes through Caddy (HTTPS).
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/backend/data
      # The APNs key (.p8) and Apple Wallet certificates; read-only, never in the image.
      - ./backend/certs:/app/backend/certs:ro
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SARENA_DOMAIN: ${SARENA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
