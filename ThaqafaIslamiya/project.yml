# بديل احتياطي: إن لم يفتح ThaqafaIslamiya.xcodeproj في نسخة Xcode لديك (يتطلب Xcode 16+)،
# ثبّت XcodeGen (brew install xcodegen) ثم نفّذ داخل هذا المجلد:  xcodegen generate
name: ThaqafaIslamiya
options:
  bundleIdPrefix: com.saqer
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
targets:
  ThaqafaIslamiya:
    type: application
    platform: iOS
    sources:
      - path: ThaqafaIslamiya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saqer.ThaqafaIslamiya
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ثقافة إسلامية"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
